openapi: 3.1.0
info:
  title: InkOS Wholesale Trade API
  version: 0.1.0-draft
  description: |
    Proposed contract for partner evaluation. The relative server path identifies the planned v1 API.
    A credential acts for one shop. Suppliers publish eligible offers and service assigned orders.
    Buyers see their own trade prices. Each party keeps its private costs and customer pricing.
    The supplier invoices and collects directly from the buyer. This preview covers firm offers
    for fixed specifications, order exchange and event recovery. Invoice synchronization, custom quotes
    and webhook registration are outside this preview. Clients should tolerate additional response
    fields and unknown feed event types. Breaking changes require a new major API path.
servers:
  - url: /api/trade/v1
    description: Proposed base path
security:
  - ShopBearer: []
paths:
  /capabilities/{capabilityId}/versions/{version}:
    parameters:
      - {name: capabilityId, in: path, required: true, schema: {type: string}}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    put:
      operationId: publishCapabilityVersion
      summary: Publish an immutable supplier capability and trade rate
      description: |
        Requires supplier catalog permission. The capability ID is globally unique and owned by the publishing shop.
        Versions increase within a capability. Repeating the same version and content succeeds.
        Different content under an existing version returns 409. The approved accounts apply to this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ListingTerms'}
                - type: object
                  required: [eligibleBuyerIds]
                  properties:
                    eligibleBuyerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
      responses:
        '204': {description: Version published or already present with identical content.}
        default: {$ref: '#/components/responses/Error'}
  /capabilities:
    get:
      operationId: searchCapabilities
      summary: Search trade offers published to the buying shop
      description: Requires buyer sourcing permission. Returns the current effective version of each matching capability visible to the caller.
      parameters:
        - {name: product, in: query, schema: {type: string, example: postcards}}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Eligible listings. Pass nextCursor to continue when it is present.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Listing'}}
                  nextCursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /offers:
    post:
      operationId: requestFirmOffer
      summary: Obtain firm terms for the exact published specification
      description: |
        Requires buyer sourcing permission. Validate current eligibility, the chosen version,
        quantity, destination, blind shipping and requested delivery date. An unsupported job
        returns 422. A new catalog version preserves previously issued terms until offer expiry.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OfferRequest'}}}
      responses:
        '201':
          description: The offer binds the selected buyer, specification, rate version and fulfillment terms through expiry.
          content: {application/json: {schema: {$ref: '#/components/schemas/Offer'}}}
        default: {$ref: '#/components/responses/Error'}
  /orders:
    post:
      operationId: dispatchOrder
      summary: Send a buyer work order to its selected supplier
      description: |
        Requires buyer purchasing permission, current trade authorization, an unexpired offer and released artwork.
        Destination and blind-shipping terms must match the offer. Idempotency is scoped to the buyer and operation.
        Identical retries return the original order. Changed content with the same key returns 409.
        One initial dispatch is allowed per buyer work order even under a fresh key. A conflicting
        dispatch of that work order returns 409. The supplier receives a dispatched inbox event.
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Dispatch'}}}
      responses:
        '201':
          description: Trade order created.
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '200':
          description: Original order returned for an identical dispatch.
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        default: {$ref: '#/components/responses/Error'}
  /orders/{orderId}:
    parameters:
      - {$ref: '#/components/parameters/OrderId'}
    get:
      operationId: getOrder
      summary: Retrieve the trade order and released job packet
      description: Requires order-read permission in the buying or assigned supplier shop. Returns agreed trade terms, production packet and last accepted status.
      responses:
        '200':
          description: Participant view of the trade order.
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        default: {$ref: '#/components/responses/Error'}
  /orders/{orderId}/artwork:
    parameters:
      - {$ref: '#/components/parameters/OrderId'}
    get:
      operationId: downloadReleasedArtwork
      summary: Download the exact file revision released on the order
      description: Requires artwork-read permission in a participating shop. Later artwork uploads preserve this release.
      responses:
        '200':
          description: Released file bytes.
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        default: {$ref: '#/components/responses/Error'}
  /orders/{orderId}/events:
    parameters:
      - {$ref: '#/components/parameters/OrderId'}
    post:
      operationId: recordSupplierEvent
      summary: Acknowledge, reject or update an assigned order
      description: |
        Requires fulfillment permission in the assigned supplier shop. Submit a stable eventId per order.
        An identical replay returns the original event and sequence. Changed content with that ID or
        an invalid transition returns 409. A delayed event cannot regress a delivered or rejected order.
        An exception flags the order for follow-up and preserves its last production status.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SupplierEvent'}}}
      responses:
        '200':
          description: Accepted event or its previously recorded result.
          content: {application/json: {schema: {$ref: '#/components/schemas/FeedEvent'}}}
        default: {$ref: '#/components/responses/Error'}
  /events:
    get:
      operationId: listTradeEvents
      summary: Read the buyer or supplier inbox and recover missed updates
      description: |
        Requires order-read permission in the selected shop. Start without a cursor to read retained
        history, including newly dispatched jobs. Save nextCursor after processing a page, then poll
        using that cursor. Empty pages still return a cursor. Only events for participating orders appear.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Ordered events and the next position for this shop's feed.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FeedEvent'}}
                  nextCursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ShopBearer:
      type: http
      scheme: bearer
      description: Scoped server credential for a single shop, its permitted actions and trade relationships.
  parameters:
    OrderId: {name: orderId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, description: Opaque position for the same shop and query., schema: {type: string}}
  responses:
    Error:
      description: |
        400 malformed input or cursor. 401 missing or invalid credential. 403 missing action permission.
        404 resource missing or outside the caller's visibility. 409 version, state, expiry or replay conflict.
        422 unsupported specification or missing release requirement. 429 request throttled.
        Retry transient 429 and 503 responses using Retry-After when supplied.
      headers:
        Retry-After: {description: Suggested delay in seconds when throttled or temporarily unavailable., schema: {type: integer, minimum: 0}}
      content:
        application/json:
          schema:
            type: object
            required: [code, message, requestId]
            properties:
              code: {type: string}
              message: {type: string}
              requestId: {type: string}
  schemas:
    TradePrice:
      type: object
      description: Print, freight and tax are separate nonnegative integer amounts in the currency's minor unit. Their sum is the total.
      required: [currency, printMinor, freightMinor, taxMinor]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$', example: CAD}
        printMinor: {type: integer, minimum: 0, example: 15000}
        freightMinor: {type: integer, minimum: 0, example: 3000}
        taxMinor: {type: integer, minimum: 0, example: 0}
    ListingTerms:
      type: object
      description: Each version prices one exact material, process, finish, size and run quantity. Specify sides and colour for printed work and fabrication properties for cut or machined work.
      required: [product, widthMm, heightMm, media, finish, quantity, price, effectiveAt, leadBusinessDays, shipCountries, blindShippingSupported]
      properties:
        product: {type: string, example: postcards}
        widthMm: {type: number, exclusiveMinimum: 0, example: 127}
        heightMm: {type: number, exclusiveMinimum: 0, example: 177.8}
        media: {type: string, example: '100 lb cover'}
        process: {type: string, example: CNC routing}
        materialThicknessMm: {type: number, exclusiveMinimum: 0, example: 6}
        cutPathFormat: {type: string, example: closed vector contours}
        sides: {type: integer, enum: [1, 2]}
        colour: {type: string, example: full-colour}
        finish: {type: string, example: trim}
        quantity: {type: integer, minimum: 1, example: 1000}
        price: {$ref: '#/components/schemas/TradePrice'}
        effectiveAt: {type: string, format: date-time}
        leadBusinessDays: {type: integer, minimum: 0, description: From supplier receipt of released artwork.}
        shipCountries: {type: array, minItems: 1, items: {type: string, pattern: '^[A-Z]{2}$'}}
        blindShippingSupported: {type: boolean}
    Listing:
      allOf:
        - {$ref: '#/components/schemas/ListingTerms'}
        - type: object
          required: [supplierId, capabilityId, version]
          properties:
            supplierId: {type: string}
            capabilityId: {type: string}
            version: {type: integer, minimum: 1}
    OfferRequest:
      type: object
      required: [capabilityId, version, quantity, destinationCountry, destinationPostalCode, requestedDeliveryDate, blindShipping]
      properties:
        capabilityId: {type: string}
        version: {type: integer, minimum: 1}
        quantity: {type: integer, minimum: 1}
        destinationCountry: {type: string, pattern: '^[A-Z]{2}$'}
        destinationPostalCode: {type: string}
        requestedDeliveryDate: {type: string, format: date}
        blindShipping: {type: boolean}
    Offer:
      allOf:
        - {$ref: '#/components/schemas/OfferRequest'}
        - type: object
          required: [offerId, supplierId, buyerId, price, expiresAt, promisedShipDate, specification]
          properties:
            offerId: {type: string}
            supplierId: {type: string}
            buyerId: {type: string}
            price: {$ref: '#/components/schemas/TradePrice'}
            expiresAt: {type: string, format: date-time}
            promisedShipDate: {type: string, format: date}
            specification: {$ref: '#/components/schemas/Listing'}
    Dispatch:
      type: object
      required: [offerId, workOrderId, poReference, artworkRevisionId, shipTo]
      properties:
        offerId: {type: string}
        workOrderId: {type: string}
        poReference: {type: string}
        artworkRevisionId: {type: string, description: Released revision belonging to the buyer work order.}
        shipTo:
          type: object
          required: [recipient, addressLines, locality, postalCode, country]
          properties:
            recipient: {type: string}
            addressLines: {type: array, minItems: 1, items: {type: string}}
            locality: {type: string}
            region: {type: string}
            postalCode: {type: string}
            country: {type: string, pattern: '^[A-Z]{2}$'}
        packingSlip:
          type: object
          description: Required for blind shipment. Use this buyer-branded sender identity and reference on the packing slip.
          required: [senderName, customerReference]
          properties:
            senderName: {type: string}
            customerReference: {type: string}
        deliveryInstructions: {type: string}
    Order:
      allOf:
        - {$ref: '#/components/schemas/Dispatch'}
        - type: object
          required: [orderId, offer, status]
          properties:
            orderId: {type: string}
            offer: {$ref: '#/components/schemas/Offer'}
            status: {type: string, enum: [dispatched, acknowledged, rejected, in_production, shipped, delivered]}
    EventDetails:
      type: object
      required: [eventId, type, occurredAt]
      properties:
        eventId: {type: string, minLength: 1}
        type: {type: string}
        occurredAt: {type: string, format: date-time}
        carrier: {type: string}
        trackingReference: {type: string}
        evidenceReference: {type: string, description: Carrier delivery evidence or buyer-confirmed receipt reference.}
        reason: {type: string}
    SupplierEvent:
      allOf:
        - {$ref: '#/components/schemas/EventDetails'}
        - type: object
          properties:
            type: {enum: [acknowledged, rejected, in_production, shipped, delivered, exception]}
        - if: {properties: {type: {const: shipped}}}
          then: {required: [carrier, trackingReference]}
        - if: {properties: {type: {const: delivered}}}
          then: {required: [evidenceReference]}
        - if: {properties: {type: {enum: [exception, rejected]}}}
          then: {required: [reason]}
    FeedEvent:
      allOf:
        - {$ref: '#/components/schemas/EventDetails'}
        - type: object
          description: Includes the initial dispatched event. Sequence increases within each order.
          required: [orderId, sequence]
          properties:
            orderId: {type: string}
            sequence: {type: integer, minimum: 1}
